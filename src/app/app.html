<div class="min-h-screen bg-neutral-900 text-white w-full relative pt-0.5 md:pt-2">
  <!-- Global Language Switcher -->
  <div class="absolute top-1.5 right-2 md:top-3 md:right-4 z-50 flex items-center gap-2">
    <button 
      (click)="lang.toggle()" 
      class="px-2.5 py-1 bg-neutral-800/80 hover:bg-neutral-700/80 text-xs text-neutral-200 border border-neutral-700/60 rounded-lg flex items-center gap-1.5 transition-all active:scale-95 shadow-md cursor-pointer select-none font-medium font-sans"
    >
      <span>🌐</span>
      <span>{{ lang.get() === 'ru' ? 'English' : 'Русский' }}</span>
      <span class="text-[9px] bg-neutral-950/60 text-neutral-400 font-bold font-mono px-1 py-0.2 rounded border border-white/5">
        {{ lang.get().toUpperCase() }}
      </span>
    </button>
  </div>

  <ng-container *ngIf="gameState() === 'setup'">
    <app-home (startGame)="handleStartGame($event)" (analyzeGame)="handleAnalyze($event)"></app-home>
  </ng-container>

  <ng-container *ngIf="gameState() === 'playing' && gameSettings()">
    <app-game
      [settings]="gameSettings()"
      (goBack)="goBackToSetup()"
      (analyze)="handleAnalyze($event)"
    ></app-game>
  </ng-container>

  <ng-container *ngIf="gameState() === 'analysis'">
    <app-analysis [history]="gameHistory()" [depth]="analysisDepth()" [precomputedEvaluations]="precomputedEvaluations()" [elo]="gameElo()" [settings]="gameSettings()" (goBack)="goBackToSetup()"></app-analysis>
  </ng-container>
</div>
